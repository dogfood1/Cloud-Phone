name: Build And Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_PLATFORMS: linux/amd64,linux/arm64

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./frontend/web/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-cloud-phone/docker/backend.Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-phone-backend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-phone-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-cloud-phone/docker/frontend.Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-phone-frontend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-phone-frontend:latest
