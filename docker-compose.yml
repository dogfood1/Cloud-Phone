name: cloud-phone

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-local}/cloud-phone-backend:${IMAGE_TAG:-latest}
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-local}/cloud-phone-frontend:${IMAGE_TAG:-latest}
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    restart: unless-stopped
