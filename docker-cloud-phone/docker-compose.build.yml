# 本地构建镜像（context 为仓库根目录，当前机器架构）
# Linux 默认 host 网络；Mac/Windows 叠加 docker-compose.bridge.yml
# 多架构请用 build-multiarch.sh
# 用法:
#   ./compose.sh -f docker-compose.build.yml up -d --build
#   docker compose -f docker-compose.build.yml --env-file ../.env up -d --build
name: cloud-phone

services:
  backend:
    build:
      context: ..
      dockerfile: docker-cloud-phone/docker/backend.Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-dogfood1}/cloud-phone-backend:${IMAGE_TAG:-latest}
    network_mode: host
    pid: host
    privileged: true
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
      CLOUD_PHONE_PREFER_SYSTEM_ADB: "1"
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:127.0.0.1:5037}
      CLOUD_PHONE_DATA_DIR: /data
      REDROID_IMAGE_TAG: ${REDROID_IMAGE_TAG:-redroid:13.0.0_arm64_only_extcam_rgba_blob_jpegfix}
      REDROID_HOST_WORKDIR: ${REDROID_HOST_WORKDIR:-/root/redroid-extcam}
      REDROID_CAMERA_VIDEO_NR: ${REDROID_CAMERA_VIDEO_NR:-20}
      REDROID_CAMERA_WIDTH: ${REDROID_CAMERA_WIDTH:-1280}
      REDROID_CAMERA_HEIGHT: ${REDROID_CAMERA_HEIGHT:-720}
      REDROID_CAMERA_FPS: ${REDROID_CAMERA_FPS:-30}
      REDROID_CONTAINER_ADB_PORT: ${REDROID_CONTAINER_ADB_PORT:-5554}
      REDROID_ADB_AUTO_CONNECT: ${REDROID_ADB_AUTO_CONNECT:-1}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${REDROID_HOST_WORKDIR:-/root/redroid-extcam}:${REDROID_HOST_WORKDIR:-/root/redroid-extcam}
    devices:
      - /dev/video${REDROID_CAMERA_VIDEO_NR:-20}:/dev/video${REDROID_CAMERA_VIDEO_NR:-20}
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker-cloud-phone/docker/frontend.Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-dogfood1}/cloud-phone-frontend:${IMAGE_TAG:-latest}
    network_mode: host
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      BACKEND_ORIGIN: http://127.0.0.1:${BACKEND_PORT:-3000}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
    depends_on:
      - backend
    restart: unless-stopped
