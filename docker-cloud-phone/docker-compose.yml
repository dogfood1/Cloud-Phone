# 从 Docker Hub 拉取镜像（默认 dogfood1/cloud-phone-*）
# Linux 默认 host 网络：前后端共享宿主机网络栈，可枚举全部网卡、ADB 局域网、mDNS
# Mac/Windows 请叠加 bridge：./compose.sh -f docker-compose.yml -f docker-compose.bridge.yml up -d
# 用法:
#   ./compose.sh up -d
#   docker compose --env-file ../.env up -d
name: cloud-phone

services:
  backend:
    image: ${DOCKERHUB_NAMESPACE:-dogfood1}/cloud-phone-backend:${IMAGE_TAG:-latest}
    network_mode: host
    pid: host
    privileged: true
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
      CLOUD_PHONE_PREFER_SYSTEM_ADB: "1"
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:127.0.0.1:5037}
      CLOUD_PHONE_DATA_DIR: /data
      REDROID_IMAGE_TAG: ${REDROID_IMAGE_TAG:-redroid:13.0.0_arm64_only_extcam_rgba_blob_jpegfix_facecfg_webview109}
      REDROID_HOST_WORKDIR: ${REDROID_HOST_WORKDIR:-/root/redroid-extcam}
      REDROID_CAMERA_VIDEO_NR: ${REDROID_CAMERA_VIDEO_NR:-20}
      REDROID_CAMERA_WIDTH: ${REDROID_CAMERA_WIDTH:-1280}
      REDROID_CAMERA_HEIGHT: ${REDROID_CAMERA_HEIGHT:-720}
      REDROID_CAMERA_FPS: ${REDROID_CAMERA_FPS:-30}
      REDROID_CAMERA_LENS_FACING: ${REDROID_CAMERA_LENS_FACING:-front}
      REDROID_CAMERA_SENSOR_ORIENTATION: ${REDROID_CAMERA_SENSOR_ORIENTATION:-0}
      REDROID_CONTAINER_ADB_PORT: ${REDROID_CONTAINER_ADB_PORT:-5554}
      REDROID_ADB_AUTO_CONNECT: ${REDROID_ADB_AUTO_CONNECT:-1}
      REDROID_PROXY_IMAGE: ${REDROID_PROXY_IMAGE:-ghcr.io/sagernet/sing-box:v1.10.7}
      REDROID_PROXY_PROBE_IMAGE: ${REDROID_PROXY_PROBE_IMAGE:-curlimages/curl:8.10.1}
      REDROID_PROXY_DIR: ${REDROID_PROXY_DIR:-/root/redroid-extcam/proxy}
      GOCAPTURE_URL: ${GOCAPTURE_URL:-http://127.0.0.1:9081}
      GOCAPTURE_WEB_TOKEN: ${GOCAPTURE_WEB_TOKEN:-}
      GOCAPTURE_PROXY_HOST: ${GOCAPTURE_PROXY_HOST:-172.17.0.1}
      GOCAPTURE_HTTP_PORT: ${GOCAPTURE_HTTP_PORT:-9080}
      GOCAPTURE_TCP_PORT: ${GOCAPTURE_TCP_PORT:-9082}
      REDROID_CAPTURE_SOCKS_PORT: ${REDROID_CAPTURE_SOCKS_PORT:-1080}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      - ${REDROID_HOST_WORKDIR:-/root/redroid-extcam}:${REDROID_HOST_WORKDIR:-/root/redroid-extcam}
    devices:
      - /dev/video${REDROID_CAMERA_VIDEO_NR:-20}:/dev/video${REDROID_CAMERA_VIDEO_NR:-20}
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-dogfood1}/cloud-phone-frontend:${IMAGE_TAG:-latest}
    network_mode: host
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      BACKEND_ORIGIN: http://127.0.0.1:${BACKEND_PORT:-3000}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
    depends_on:
      - backend
    restart: unless-stopped
