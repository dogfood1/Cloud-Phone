# 从 Docker Hub 拉取镜像（需设置 DOCKERHUB_NAMESPACE）
# 用法: docker compose --env-file ../.env up -d
name: cloud-phone

services:
  backend:
    image: ${DOCKERHUB_NAMESPACE}/cloud-phone-backend:${IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/cloud-phone-frontend:${IMAGE_TAG:-latest}
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    restart: unless-stopped
