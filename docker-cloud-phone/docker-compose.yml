# 从 Docker Hub 拉取镜像（默认 yiyifred/cloud-phone-*）
# Linux 默认 host 网络：前后端共享宿主机网络栈，可枚举全部网卡、ADB 局域网、mDNS
# Mac/Windows 请叠加 bridge：./compose.sh -f docker-compose.yml -f docker-compose.bridge.yml up -d
# 用法:
#   ./compose.sh up -d
#   docker compose --env-file ../.env up -d
name: cloud-phone

services:
  backend:
    image: ${DOCKERHUB_NAMESPACE:-yiyifred}/cloud-phone-backend:${IMAGE_TAG:-latest}
    network_mode: host
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
      CLOUD_PHONE_PREFER_SYSTEM_ADB: "1"
      CLOUD_PHONE_DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-yiyifred}/cloud-phone-frontend:${IMAGE_TAG:-latest}
    network_mode: host
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      BACKEND_ORIGIN: http://127.0.0.1:${BACKEND_PORT:-3000}
      CLOUD_PHONE_USE_HOST_NETWORK: "1"
    depends_on:
      - backend
    restart: unless-stopped
